name: CI

on:
  push:
    branches: [main]
    # A docs-only push cannot break the gate, and the "record the SHA" commit
    # that follows every backlog item touches nothing else.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # Manual trigger. Needed the first time this repo pushed: on a NEW branch
  # GitHub evaluates paths-ignore against the head commit alone, and the head
  # commit of every backlog item is the docs-only "record the SHA" one — so the
  # very first push skipped the gate entirely. Later pushes evaluate the whole
  # before..after range and trigger normally.
  workflow_dispatch:

# Pushing twice in quick succession should not pay for the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/countertop_ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/countertop_ci
  SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/countertop_ci_shadow

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      - name: Create throwaway databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE countertop_ci;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE countertop_ci_shadow;"

      # Migrations applied from scratch against a throwaway Postgres. Never
      # `db push` — the hand-written constraints and triggers (order number
      # uniqueness, idempotency key, append-only event log) only exist in
      # migration files, and a schema pushed straight from schema.prisma
      # silently drops every one of them.
      - name: Apply migrations from scratch
        run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      # Generated by `postinstall` during `npm ci`. Asserted rather than
      # re-run: a gitignored generated artifact that exists locally and not
      # here is the single most common way this workflow fails.
      - name: Assert generated artifacts exist
        run: test -d packages/db/generated/client || (echo "Prisma client missing - postinstall did not run" && exit 1)

      # The objects Prisma cannot express (C-003). Without this, a future
      # migration could drop the append-only trigger and every constraint test
      # would still pass against a stale local database — CI is the only place
      # that builds the schema from nothing.
      - name: Assert the hand-written invariants exist
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d countertop_ci -v ON_ERROR_STOP=1 <<'EOSQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname='order_event_append_only') THEN
              RAISE EXCEPTION 'the OrderEvent append-only trigger is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname='restaurant_settings_singleton') THEN
              RAISE EXCEPTION 'the RestaurantSettings singleton CHECK is missing';
            END IF;
            -- Prisma emits these as unique INDEXES, not table constraints, so
            -- they live in pg_class rather than pg_constraint. Checking the
            -- wrong catalog is a green assertion that verifies nothing.
            IF NOT EXISTS (SELECT 1 FROM pg_class WHERE relname='Order_businessDay_seq_key') THEN
              RAISE EXCEPTION 'the (businessDay, seq) unique index is missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_class WHERE relname='Order_idempotencyKey_key') THEN
              RAISE EXCEPTION 'the idempotency key unique index is missing';
            END IF;
          END $$;
          EOSQL

      # schema.prisma must match what the committed migration history produces.
      # Without this, a hand-edited migration and the schema drift apart and
      # every local test passes against a database CI can never rebuild.
      - name: Drift check (schema.prisma vs migration history)
        run: >
          npx prisma migrate diff
          --from-migrations packages/db/prisma/migrations
          --to-schema-datamodel packages/db/prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

      # CLAUDE.md: identical results under any process TZ. The order-number
      # reset and the report bucketing are restaurant-timezone questions; a
      # UTC-only CI hides exactly the bugs that rule exists to catch.
      - name: Unit suite — TZ=UTC
        run: npm test
        env:
          TZ: UTC
      - name: Unit suite — TZ=Pacific/Kiritimati
        run: npm test
        env:
          TZ: Pacific/Kiritimati

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: e2e (production build, port 3400)
        run: npm run test:e2e
        env:
          CI: true
          PORT: 3400
