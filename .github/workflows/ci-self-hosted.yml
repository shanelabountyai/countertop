name: CI (self-hosted)

# The fallback, not the CI. `ci.yml` runs on a GitHub-hosted runner and is the
# one that would catch a macOS-only assumption; this workflow ran on every push
# only while GitHub-hosted minutes were billing-blocked (C-029 → C-036). The
# repo going public (C-044) restored those minutes, so this one stops firing
# automatically and stays one click away for the day billing bites again.
#
# DO NOT ADD `pull_request` — OR ANY FORK-REACHABLE TRIGGER — TO THIS FILE.
# `runs-on: self-hosted` executes the checked-out repo's code on the
# developer's own Mac. On a PUBLIC repo, a fork-triggered workflow is a
# stranger's pull request running arbitrary commands on that machine; GitHub
# documents self-hosted runners as unsafe for public repos for exactly this
# reason. `workflow_dispatch` is reachable only by someone with write access,
# which is what makes it the safe trigger to keep.

on:
  workflow_dispatch:

concurrency:
  group: ci-self-hosted-${{ github.ref }}
  cancel-in-progress: true

env:
  # NOT 3400. The runner shares this machine with the developer's dev server,
  # and the whole port table exists because two things listening on one port
  # fail silently rather than loudly.
  PORT: 3450
  # NOT countertop_test either — the runner must never drop the database a
  # local sweep is in the middle of using.
  RUNNER_DB: countertop_runner

jobs:
  gate:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      # The step the pre-push hook structurally cannot run: install from the
      # lockfile into a tree with no node_modules. A dependency that is missing
      # from package.json but happens to be installed locally fails here.
      - run: npm ci

      # .env.test and .env.local are gitignored, so a clean checkout has
      # neither. The runner writes its own, pointed at its own database.
      - name: Write the runner's env files
        run: |
          URL="postgresql://$(whoami)@localhost:5432/$RUNNER_DB"
          # STAFF_PASSCODE is not a secret here: it gates a queue screen on a
          # throwaway database on this machine. It is written rather than
          # defaulted because the app FAILS CLOSED without it (C-037), so a CI
          # run with no value would be 90-odd e2e tests stuck on a login page.
          printf 'DATABASE_URL=%s\nDIRECT_URL=%s\nSTAFF_PASSCODE=ci-runner\n' "$URL" "$URL" > .env.test
          printf 'DATABASE_URL=%s\nDIRECT_URL=%s\nPORT=%s\nSTAFF_PASSCODE=ci-runner\n' "$URL" "$URL" "$PORT" > .env.local

      # --force (PG13+) terminates whatever is still attached. Without it a
      # previous run's leaked connection pool makes THIS run fail before it
      # starts, which is how one bad teardown blocks every run after it.
      - name: Build the runner's database from scratch
        run: |
          dropdb --force --if-exists "$RUNNER_DB"
          createdb "$RUNNER_DB"
          npm run db:migrate:test

      # Before ci:local, not after: its unit suite includes the packages/db
      # tests, and those connect to the database .env.test names. Ordering this
      # the other way is green on a laptop, where that database already exists,
      # and fails only here — which is the whole reason a clean checkout runs.
      # Migrations from nothing, the hand-written invariants, the drift check,
      # and the unit suite under two hostile timezones — one script, shared
      # with the pre-push hook.
      - run: npm run ci:local

      - run: npm run lint
      - run: npm run typecheck

      # Its own step, before Playwright can bury it (C-024).
      - run: npm run build:test

      # This runner shares a machine with a human. Anything left listening on
      # its port — a crashed run, a dev server someone started with PORT set,
      # a process a previous job did not reap — makes Playwright refuse to
      # start, or worse, adopt it. The port is the runner's alone, so freeing
      # it by port is precise rather than a blunt pkill.
      - name: Free port ${{ env.PORT }}
        run: PIDS=$(lsof -ti :$PORT || true); [ -z "$PIDS" ] || kill -9 $PIDS

      - name: e2e (production build)
        run: npm run test:e2e
        env:
          CI: true

      # The port BEFORE the database: the served app is what holds the pool,
      # and this step runs under `bash -e`, so a dropdb that fails first aborts
      # the step and the kill never happens — leaving the connections that made
      # it fail. That is exactly how the runner wedged after C-042.
      - name: Free the port and drop the runner's database
        if: always()
        run: |
          PIDS=$(lsof -ti :$PORT || true); [ -z "$PIDS" ] || kill -9 $PIDS
          dropdb --force --if-exists "$RUNNER_DB"
