# Optional. The convention (~/.claude/CLAUDE.md, "Tests never point at a remote
# database") is a local Postgres install — `brew install postgresql@17` — and
# that is what .env.test/.env.local point at. This file exists for a machine
# without one; 5435 keeps clear of bookable's 5434.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: countertop
      POSTGRES_PASSWORD: countertop
      POSTGRES_DB: countertop_dev
    ports:
      - "5435:5432"
    volumes:
      - countertop-pg:/var/lib/postgresql/data
volumes:
  countertop-pg:
